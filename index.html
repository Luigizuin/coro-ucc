<!doctype html>

<body>
<header class="cab" id="cab">
  <button class="tecla atras oculto" id="atras" aria-label="Volver a la página anterior" title="Volver a la página anterior"><svg class="svg-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg><span>Atrás</span></button>

</header>
<main id="vista"></main>
<dialog class="paleta" id="paleta" aria-label="Buscar obra">
  <input id="paleta-q" type="search" placeholder="Buscar obra o compositor" autocomplete="off" aria-label="Buscar obra">

<script>window.CORO_PUBLICADA = true;</script>
